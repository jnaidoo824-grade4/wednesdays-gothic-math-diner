<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wednesday's Gothic Math Diner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #05040a; color: #fff; font-family: system-ui, sans-serif; height: 100vh; width: 100vw; overflow: hidden; }
    
    /* Force interactive layer z-index */
    #start-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0d081a; z-index: 999999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 20px;
    }

    .start-btn {
      background: #9d4edd; color: #fff; border: 3px solid #00f0ff;
      padding: 20px 40px; font-size: 20px; font-weight: bold; border-radius: 50px;
      margin-top: 20px; cursor: pointer; box-shadow: 0 0 20px #00f0ff;
    }

    #game-ui { display: none; padding: 20px; text-align: center; }
    .card { background: #160f29; border: 2px solid #9d4edd; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .action-btn { background: #00f0ff; color: #000; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; }
    input { background: #000; border: 2px solid #9d4edd; color: #fff; padding: 12px; font-size: 18px; border-radius: 12px; width: 120px; text-align: center; }
  </style>
</head>
<body>

<div id="start-screen">
  <h1 style="color: #9d4edd; margin-bottom: 10px;">🕷️ ADDAMS MATH 3D</h1>
  <p style="color: #00f0ff;">Wednesday's Gothic Diner</p>
  <button id="main-start-btn" class="start-btn">TAP TO PLAY</button>
</div>

<div id="game-ui">
  <div class="card">
    <h2 id="speaker" style="color: #00f0ff; font-size: 14px; margin-bottom: 10px;">WEDNESDAY ADDAMS</h2>
    <p id="question" style="font-size: 20px; font-weight: bold;">Loading...</p>
  </div>

  <div style="display: flex; gap: 10px; justify-content: center;">
    <input type="number" id="ans" placeholder="?" />
    <button id="submit-btn" class="action-btn">SUBMIT</button>
  </div>
</div>

<script>
  let targetAns = 0;

  function handleStart() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-ui').style.display = 'block';
    loadProblem();
  }

  function loadProblem() {
    let a = Math.floor(Math.random() * 50) + 10;
    let b = Math.floor(Math.random() * 50) + 10;
    targetAns = a + b;
    document.getElementById('question').innerText = `What is ${a} + ${b}?`;
  }

  function checkAnswer() {
    let inputVal = parseInt(document.getElementById('ans').value);
    if (inputVal === targetAns) {
      alert("✨ Correct! Well done.");
      document.getElementById('ans').value = "";
      loadProblem();
    } else {
      alert("🕸️ Incorrect, try again!");
    }
  }

  // Dual Event Binding for iOS/Android Touch Reliability
  const startBtn = document.getElementById('main-start-btn');
  startBtn.addEventListener('click', handleStart);
  startBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    handleStart();
  }, { passive: false });

  const subBtn = document.getElementById('submit-btn');
  subBtn.addEventListener('click', checkAnswer);
  subBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    checkAnswer();
  }, { passive: false });
</script>

</body>
</html>
