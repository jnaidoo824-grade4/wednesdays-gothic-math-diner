<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Wednesday's Gothic Math Diner</title>
  <style>
    :root {
      --bg: #101018;
      --card-bg: #1c1c2b;
      --accent: #9d4edd;
      --accent-light: #c77dff;
      --gold: #ffd700;
      --text: #e0e0e0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      user-select: none;
    }
    .card {
      background: var(--card-bg);
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      border-radius: 20px;
      border: 2px solid var(--accent);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }
    .term-nav {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .term-btn {
      background: #2a2a3d;
      color: #aaa;
      border: 1px solid #444;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
    }
    .term-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent-light);
    }
    .char-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #252538;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid #3d3d5c;
      margin-bottom: 12px;
      text-align: left;
    }
    .char-avatar {
      font-size: 38px;
      background: #101018;
      width: 55px;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid var(--accent-light);
      flex-shrink: 0;
    }
    .char-speech {
      font-size: 13px;
      color: #d1d1e0;
      line-height: 1.3;
    }
    .char-name {
      font-weight: bold;
      color: var(--accent-light);
      font-size: 14px;
      display: block;
    }
    .interactive-zone {
      background: #141420;
      border-radius: 14px;
      padding: 16px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
      margin-bottom: 12px;
      position: relative;
    }
    .problem-title {
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 12px;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }
    .opt-btn {
      background: #2c2c44;
      color: #fff;
      border: 1px solid var(--accent);
      padding: 12px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .opt-btn:active { transform: scale(0.96); }
    canvas {
      touch-action: none;
      border-radius: 10px;
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      color: var(--gold);
      padding: 6px 4px;
    }
    .action-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      margin: 4px;
    }
    .wa-btn { background: #25D366; color: white; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .shop-modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(16, 16, 24, 0.95);
      z-index: 10;
      padding: 16px;
      box-sizing: border-box;
      overflow-y: auto;
    }
    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #252538;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 8px;
    }
    #confetti-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>

<div class="card">
  <canvas id="confetti-canvas"></canvas>

  <div class="term-nav">
    <button class="term-btn active" onclick="loadTerm(1)">Term 1: Cauldron</button>
    <button class="term-btn" onclick="loadTerm(2)">Term 2: Buffet</button>
    <button class="term-btn" onclick="loadTerm(3)">Term 3: Pizza Shop</button>
    <button class="term-btn" onclick="loadTerm(4)">Term 4: Expansion</button>
  </div>

  <div class="char-box">
    <div class="char-avatar" id="char-avatar">🕷️</div>
    <div class="char-speech">
      <span class="char-name" id="char-name">Wednesday Addams</span>
      <span id="char-text">Welcome to Nevermore's math diner. Pay attention, or face Mortis.</span>
    </div>
  </div>

  <div class="interactive-zone" id="game-zone">
    <!-- Dynamic Content Loaded Here -->
  </div>

  <div class="stats-bar">
    <span>🪙 Gothic Coins: <span id="coin-count">0</span></span>
    <span>🏆 Score: <span id="score-count">0</span></span>
  </div>

  <div>
    <button class="action-btn" onclick="openShop()">🏚️ Decor Shop</button>
    <button class="action-btn wa-btn" onclick="shareWhatsApp()">📲 WhatsApp Challenge</button>
  </div>

  <!-- Shop Overlay -->
  <div class="shop-modal" id="shop-modal">
    <h2 style="color: var(--accent-light);">🕷️ Gothic Decor Shop</h2>
    <p style="font-size: 12px; color: #aaa;">Unlock items with your Gothic Coins!</p>
    <div id="shop-items-container"></div>
    <br>
    <button class="action-btn" onclick="closeShop()">Close Shop</button>
  </div>
</div>

<script>
  // Game State
  let currentTerm = 1;
  let coins = parseInt(localStorage.getItem('gothic_coins') || '0');
  let score = 0;
  let currentAnswer = null;
  let unlockedDecor = JSON.parse(localStorage.getItem('gothic_decor') || '[]');

  document.getElementById('coin-count').innerText = coins;

  // Characters Configuration
  const characters = {
    wednesday: { name: "Wednesday Addams", avatar: "🕷️", pitch: 0.6, rate: 0.9 },
    mortis: { name: "Chef Mortis", avatar: "👨‍🍳", pitch: 0.4, rate: 0.85 },
    thing: { name: "Thing & Enid", avatar: "🖐️", pitch: 1.4, rate: 1.1 },
    gomez: { name: "Gomez Addams", avatar: "🤺", pitch: 0.9, rate: 1.0 }
  };

  // Voice Engine (Speech Synthesis)
  function speakText(text, charKey) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const char = characters[charKey] || characters.wednesday;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.pitch = char.pitch;
      utterance.rate = char.rate;
      window.speechSynthesis.speak(utterance);
    }
  }

  // Audio FX Synthesizer
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);

    if (type === 'pop') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    } else if (type === 'correct') {
      osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.25);
    } else if (type === 'wrong') {
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
  }

  // Confetti Particle Engine
  const cCanvas = document.getElementById('confetti-canvas');
  const cCtx = cCanvas.getContext('2d');
  let particles = [];
  function triggerConfetti() {
    cCanvas.width = cCanvas.parentElement.clientWidth;
    cCanvas.height = cCanvas.parentElement.clientHeight;
    particles = [];
    const colors = ['#9d4edd', '#c77dff', '#ffd700', '#ffffff'];
    for (let i = 0; i < 40; i++) {
      particles.push({
        x: cCanvas.width / 2, y: cCanvas.height / 2,
        vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.7) * 12,
        size: Math.random() * 6 + 4, color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
    requestAnimationFrame(updateConfetti);
  }
  function updateConfetti() {
    cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.4; cCtx.fillStyle = p.color; cCtx.fillRect(p.x, p.y, p.size, p.size); });
    particles = particles.filter(p => p.y < cCanvas.height);
    if (particles.length > 0) requestAnimationFrame(updateConfetti);
  }

  // Term Generator Logic
  function loadTerm(termNum) {
    currentTerm = termNum;
    document.querySelectorAll('.term-btn').forEach((btn, i) => btn.classList.toggle('active', i + 1 === termNum));
    generateProblem();
  }

  function setCharacter(charKey, text) {
    const char = characters[charKey];
    document.getElementById('char-avatar').innerText = char.avatar;
    document.getElementById('char-name').innerText = char.name;
    document.getElementById('char-text').innerText = text;
    speakText(text, charKey);
  }

  function generateProblem() {
    const zone = document.getElementById('game-zone');
    zone.innerHTML = '';

    if (currentTerm === 1) {
      // Term 1: Cauldron Vault (Place Value & Rounding)
      const num = Math.floor(Math.random() * 8999) + 1000;
      const roundTo = [10, 100, 1000][Math.floor(Math.random() * 3)];
      currentAnswer = Math.round(num / roundTo) * roundTo;
      setCharacter('wednesday', `Round ${num} to the nearest ${roundTo}. Don't fail me.`);

      zone.innerHTML = `<div class="problem-title">Round ${num} to nearest ${roundTo}</div><div class="options-grid" id="opts"></div>`;
      renderOptions(currentAnswer, roundTo);

    } else if (currentTerm === 2) {
      // Term 2: Monster Buffet (Multiplication & Division)
      const a = Math.floor(Math.random() * 11) + 2;
      const b = Math.floor(Math.random() * 11) + 2;
      currentAnswer = a * b;
      setCharacter('thing', `Thing serves ${a} monster plates with ${b} eyeballs each! How many in total?`);

      zone.innerHTML = `<div class="problem-title">${a} × ${b} = ?</div><div class="options-grid" id="opts"></div>`;
      renderOptions(currentAnswer, 5);

    } else if (currentTerm === 3) {
      // Term 3: Pizza Shop (Fractions & Decimals)
      const dec = (Math.floor(Math.random() * 9) + 1) / 10;
      currentAnswer = `${dec * 10}/10`;
      setCharacter('mortis', `Chef Mortis sliced a pizza into 10 pieces. Which fraction equals ${dec}?`);

      zone.innerHTML = `<div class="problem-title">Convert ${dec} to a Fraction</div><div class="options-grid" id="opts"></div>`;
      renderOptionsText([currentAnswer, `${(dec*10)+1}/10`, `${(dec*10)-1 || 2}/10`, `${dec*10}/100`]);

    } else if (currentTerm === 4) {
      // Term 4: Expansion (Area & Perimeter)
      const length = Math.floor(Math.random() * 8) + 2;
      const width = Math.floor(Math.random() * 6) + 2;
      currentAnswer = length * width;
      setCharacter('gomez', `Ah, area calculations! Find the Area of a Gothic booth (${length}m × ${width}m).`);

      zone.innerHTML = `<div class="problem-title">Area = ${length}m × ${width}m</div><div class="options-grid" id="opts"></div>`;
      renderOptions(currentAnswer, 4);
    }
  }

  function renderOptions(correct, variance) {
    let choices = new Set([correct]);
    while (choices.size < 4) {
      let wrong = correct + (Math.floor(Math.random() * 5) - 2) * variance;
      if (wrong > 0 && wrong !== correct) choices.add(wrong);
    }
    renderOptionsText(Array.from(choices).sort(() => Math.random() - 0.5));
  }

  function renderOptionsText(arr) {
    const container = document.getElementById('opts');
    arr.forEach(val => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerText = val;
      btn.onclick = () => checkAnswer(val.toString() === currentAnswer.toString());
      container.appendChild(btn);
    });
  }

  function checkAnswer(isCorrect) {
    if (isCorrect) {
      playSound('correct');
      triggerConfetti();
      coins += 25;
      score += 100;
      localStorage.setItem('gothic_coins', coins);
      document.getElementById('coin-count').innerText = coins;
      document.getElementById('score-count').innerText = score;
      generateProblem();
    } else {
      playSound('wrong');
      alert("🕸️ Incorrect! Try again.");
    }
  }

  // Shop System
  const shopCatalog = [
    { name: "Cobweb Chandelier", cost: 50, icon: "🕯️" },
    { name: "Velvet Booth", cost: 100, icon: "🛋️" },
    { name: "Stone Gargoyle", cost: 150, icon: "🗿" },
    { name: "Gothic Counter", cost: 200, icon: "🏰" }
  ];

  function openShop() {
    const container = document.getElementById('shop-items-container');
    container.innerHTML = '';
    shopCatalog.forEach((item, index) => {
      const isOwned = unlockedDecor.includes(index);
      const div = document.createElement('div');
      div.className = 'shop-item';
      div.innerHTML = `
        <span>${item.icon} ${item.name} (${item.cost} 🪙)</span>
        <button class="action-btn" onclick="buyDecor(${index})" ${isOwned ? 'disabled' : ''}>
          ${isOwned ? 'Unlocked' : 'Buy'}
        </button>`;
      container.appendChild(div);
    });
    document.getElementById('shop-modal').style.display = 'block';
  }

  function buyDecor(index) {
    const item = shopCatalog[index];
    if (coins >= item.cost && !unlockedDecor.includes(index)) {
      coins -= item.cost;
      unlockedDecor.push(index);
      localStorage.setItem('gothic_coins', coins);
      localStorage.setItem('gothic_decor', JSON.stringify(unlockedDecor));
      document.getElementById('coin-count').innerText = coins;
      playSound('correct');
      openShop();
    } else {
      playSound('wrong');
    }
  }

  function closeShop() { document.getElementById('shop-modal').style.display = 'none'; }

  function shareWhatsApp() {
    const url = window.location.href.split('?')[0];
    const text = encodeURIComponent(`🕷️ Can you beat my score of ${score} pts in Wednesday's Gothic Math Diner? Play here: ${url}?challengeScore=${score}`);
    window.open(`https://wa.me/?text=${text}`, '_blank');
  }

  // Initial Load
  loadTerm(1);
</script>

</body>
</html>
